<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="sheen2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="innerShadow2" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropshadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9333ea" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="26" y="34" width="148" height="148" rx="34" fill="#3b0764"/>

  <g filter="url(#dropshadow2)">
    <rect x="22" y="26" width="148" height="148" rx="34" fill="url(#badgeGrad2)"/>
    <rect x="22" y="26" width="148" height="148" rx="34" fill="url(#innerShadow2)"/>
    <rect x="22" y="26" width="148" height="74" rx="34" fill="url(#sheen2)"/>
  </g>

  <path d="M40 30 Q96 18 152 30" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- browser window icon -->
  <g filter="url(#iconShadow2)">
    <rect x="54" y="60" width="92" height="72" rx="10" fill="none" stroke="#f5f3ff" stroke-width="6"/>
    <line x1="54" y1="80" x2="146" y2="80" stroke="#f5f3ff" stroke-width="6"/>
    <circle cx="66" cy="70" r="3.5" fill="#f5f3ff"/>
    <circle cx="78" cy="70" r="3.5" fill="#f5f3ff"/>
    <circle cx="90" cy="70" r="3.5" fill="#f5f3ff"/>
    <path d="M70 105 L90 105" stroke="#f5f3ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 118 L110 118" stroke="#f5f3ff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
